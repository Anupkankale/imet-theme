name: Pull Requests auto-merge

on:
  workflow_run:
    workflows: ["Test and Measure"]
    types:
      - completed

# Merging uses GH_BOT_TOKEN, so the workflow GITHUB_TOKEN needs no scopes.
permissions: {}

# workflow_run events carry no head_ref, so group on the triggering run's branch.
# One group per PR branch keeps a newer run from cancelling another PR's merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Dependabot PR auto-merge
    runs-on: ubuntu-latest
    # Only a green Test and Measure run, on a same-repository pull request,
    # started by Dependabot itself. workflow_run fires on every completion,
    # including failures, so the conclusion check is what keeps red bumps out.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Approve and merge the PR
        if: |
          contains( github.event.workflow_run.head_commit.message, 'version-update:semver-minor' ) ||
          contains( github.event.workflow_run.head_commit.message, 'version-update:semver-patch' )
        # gh reads GH_TOKEN. Without the GH_BOT_TOKEN secret, skip with a warning
        # instead of failing: the PR simply waits for a manual merge.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_BOT_TOKEN secret is not set; PR #$PR_NUMBER left for a manual merge."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --merge --delete-branch
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}

  gutenberg-packages:
    name: Gutenberg packages update PR auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'rtBot'
    steps:
      - name: Approve and merge the PR
        if: |
          startsWith(github.event.workflow_run.head_commit.message, 'Update WordPress NPM packages based on Gutenberg release') &&
          endsWith(github.event.workflow_run.head_commit.message, format('{0} {1}', 'rtBot', '<43742164+rtBot@users.noreply.github.com>')) &&
          github.event.workflow_run.head_commit.author.name == 'rtBot' &&
          github.event.workflow_run.head_commit.author.email == '43742164+rtBot@users.noreply.github.com'
        # gh reads GH_TOKEN. Without the GH_BOT_TOKEN secret, skip with a warning
        # instead of failing: the PR simply waits for a manual merge.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_BOT_TOKEN secret is not set; PR #$PR_NUMBER left for a manual merge."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --merge --delete-branch
        env:
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
