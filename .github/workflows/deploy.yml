name: Deploy

# One branch: every push to main deploys to the site (the "staging" environment holds its SSH secrets).
# Rollback: Actions → Deploy → Run workflow and give an older tag or commit as "ref".

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options:
          - staging
        required: true
      ref:
        description: Tag, branch or commit to deploy (empty = the branch this run was started from). Use an older tag to roll back.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  # themes or plugins: where this repo lives under wp-content/. The folder name is the repository name.
  TARGET_KIND: themes
  TARGET_NAME: ${{ github.event.repository.name }}

jobs:
  # Build once, with no access to any secret, and hand the finished folder to the deploy jobs.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up PHP
        if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install and build front end
        if: hashFiles('package.json') != ''
        run: |
          npm ci --ignore-scripts
          npm run build:prod --if-present

      - name: Install production PHP dependencies
        if: hashFiles('composer.json') != ''
        run: |
          # --no-scripts: this theme's post-install script runs `npm i`, which a deploy build must not do.
          if [ "$(jq '(.require // {}) | with_entries(select(.key != "php" and (.key | startswith("ext-") | not))) | length' composer.json)" -gt 0 ]; then
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --prefer-dist
          fi

      - name: Assemble the deployable folder
        run: |
          mkdir -p "$RUNNER_TEMP/dist/$TARGET_NAME"
          rsync -a --exclude-from=.deployignore ./ "$RUNNER_TEMP/dist/$TARGET_NAME/"
          echo "Files to deploy:"; (cd "$RUNNER_TEMP/dist/$TARGET_NAME" && find . -type f | wc -l)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist/${{ env.TARGET_NAME }}
          if-no-files-found: error
          retention-days: 7

  staging:
    name: Deploy to site
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      # Only for the deploy action itself; the code to deploy comes from the build artifact.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - uses: ./.github/actions/deploy-hostinger
        with:
          source: ${{ runner.temp }}/dist
          kind: ${{ env.TARGET_KIND }}
          name: ${{ env.TARGET_NAME }}
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          wp-path: ${{ secrets.WP_PATH }}
          site-url: ${{ vars.SITE_URL }}
